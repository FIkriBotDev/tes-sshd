<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriScan AI by ExodusAI</title>
  <meta name="description" content="Scan your food. Know what’s good." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f2f4f6; }
    .card-custom { max-width: 1400px; margin: 50px auto; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); background: #fff; }
    .image-preview { max-height: 300px; object-fit: contain; margin-bottom: 1rem; }
    .loading-spinner { font-size: 2rem; text-align: center; }
    .text-green { color: #28a745; }
    .text-red { color: #dc3545; }
    .badge-pill { padding: 10px 20px; font-size: 0.9rem; border-radius: 50rem; }
    .card-box { background-color: #f8f9fa; border-left: 4px solid #0d6efd; border-radius: 8px; padding: 10px 15px; margin-bottom: 10px; }
    .badge-value { font-weight: bold; background-color: #e9ecef; border-radius: 12px; padding: 4px 8px; margin-left: 6px; }
    @media (min-width: 992px) {
      #layoutRow { display: flex; gap: 30px; }
      #leftColumn, #rightColumn { flex: 1; }
    }
    #chatbotContainer { position: fixed; bottom: 20px; right: 20px; width: 350px; max-height: 500px; z-index: 9999; }
    #chatWindow { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 10px; height: 400px; overflow-y: auto; }
    .chat-message { margin-bottom: 10px; }
    .chat-user { text-align: right; color: #0d6efd; }
    .chat-bot { text-align: left; color: #000; }
  </style>
</head>
<body>
  <div class="card card-custom">
    <h4 class="mb-4">🍽️ NutriScan AI by ExodusAI</h4>

    <div class="mb-3 d-flex gap-2">
      <button class="btn btn-info text-white" onclick="document.getElementById('fileInput').click()">📷 Camera</button>
      <input type="file" id="fileInput" accept="image/*" class="d-none" onchange="handleImageUpload(event)" />
      <button class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">📤 Upload</button>
    </div>

    <div id="previewContainer" class="text-center d-none">
      <img id="previewImage" src="" class="img-fluid rounded image-preview" />
      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-dark btn-sm" onclick="startAnalysis()">Analyze</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="resetImage()">Reset</button>
      </div>
    </div>

    <div id="loading" class="loading-spinner text-center mt-4 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p>Analyzing with AI...</p>
    </div>

    <div id="resultContainer" class="mt-4 d-none">
      <h5 class="mb-3">📊 Result:</h5>
      <div id="layoutRow">
        <div id="leftColumn">
          <!-- ... existing result sections ... -->
        </div>
        <div id="rightColumn">
          <!-- ... existing result sections ... -->
        </div>
      </div>
    </div>
  </div>

  <!-- Chatbot UI -->
  <div id="chatbotContainer">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">NutriChat AI</div>
      <div id="chatWindow"></div>
      <div class="input-group p-2">
        <input type="text" id="chatInput" class="form-control" placeholder="Ask me about your food...">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

<script>
  let selectedFile = null;
  let chartInstance = null;

  function handleImageUpload(event) {
    // ... existing code ...
  }

  function resetImage() {
    // ... existing code ...
  }

  async function startAnalysis() {
    // ... existing code ...
  }

  function sendChat() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    const chatWindow = document.getElementById('chatWindow');
    chatWindow.innerHTML += `<div class='chat-message chat-user'><strong>You:</strong> ${message}</div>`;
    input.value = '';
    chatWindow.scrollTop = chatWindow.scrollHeight;

    axios.post('https://api.exoduscloud.my.id/chat', { message })
      .then(res => {
        const reply = res.data.reply || 'No response';
        chatWindow.innerHTML += `<div class='chat-message chat-bot'><strong>Bot:</strong> ${reply}</div>`;
        chatWindow.scrollTop = chatWindow.scrollHeight;
      })
      .catch(err => {
        chatWindow.innerHTML += `<div class='chat-message chat-bot text-danger'>Error getting response</div>`;
      });
  }
</script>
</body>
</html>
