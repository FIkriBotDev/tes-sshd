<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScan AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            background-color: #f4f4f4;
            padding: 20px;
        }
        .card-custom {
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .chatbot-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
        }
        .chatbot-container {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            z-index: 1000;
        }
        .chatbot-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card card-custom">
            <h2 class="mb-4">NutriScan AI</h2>
            <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="form-control mb-3">
            <div id="imagePreview" class="mb-3"></div>
            <button onclick="startAnalysis()" class="btn btn-primary mb-3">Mulai Analisis</button>
            <button onclick="resetImage()" class="btn btn-secondary mb-3">Reset</button>
            <div id="resultContainer" style="display: none">
                <h4>Hasil Analisis</h4>
                <div id="resultText"></div>
                <canvas id="macroChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Tombol Chatbot AI -->
    <button class="chatbot-button" onclick="toggleChatbot()">💬</button>

    <!-- Kotak Chatbot AI -->
    <div class="chatbot-container" id="chatbotContainer">
        <iframe src="https://chatbot.exodusai.my.id" class="chatbot-iframe"></iframe>
    </div>

    <script>
        let selectedImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    selectedImage = e.target.result;
                    document.getElementById("imagePreview").innerHTML = `<img src="${selectedImage}" class="img-fluid rounded" style="max-height: 300px;"/>`;
                };
                reader.readAsDataURL(file);
            }
        }

        async function startAnalysis() {
            if (!selectedImage) {
                alert("Silakan upload gambar terlebih dahulu.");
                return;
            }
            try {
                const response = await axios.post("https://nutriscan.exodusai.my.id/api/analisis", {
                    image: selectedImage
                });
                const data = response.data;
                document.getElementById("resultText").innerHTML = `<pre>${data.text}</pre>`;
                renderChart(data.chart);
                document.getElementById("resultContainer").style.display = "block";
            } catch (error) {
                alert("Gagal menganalisis gambar.");
                console.error(error);
            }
        }

        function renderChart(chartData) {
            const ctx = document.getElementById("macroChart").getContext("2d");
            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: ["Kalori", "Karbohidrat", "Protein", "Lemak"],
                    datasets: [{
                        label: "Nutrisi",
                        data: [
                            chartData.kalori,
                            chartData.karbohidrat,
                            chartData.protein,
                            chartData.lemak
                        ],
                        backgroundColor: [
                            "#ff6384",
                            "#36a2eb",
                            "#4bc0c0",
                            "#ffcd56"
                        ]
                    }]
                }
            });
        }

        function resetImage() {
            selectedImage = null;
            document.getElementById("imagePreview").innerHTML = "";
            document.getElementById("resultContainer").style.display = "none";
        }

        function toggleChatbot() {
            const chatbot = document.getElementById("chatbotContainer");
            chatbot.style.display = chatbot.style.display === "none" ? "block" : "none";
        }
    </script>
</body>

</html>
