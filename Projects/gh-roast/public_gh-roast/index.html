<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Roast AI</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-xl">

    <!-- Title -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight">
        GitHub Roast <span class="text-indigo-500">AI</span>
      </h1>
      <p class="text-gray-400 mt-2 text-sm">
        Masukin username GitHub dan siap-siap kena roasting 🔥
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl">

      <label class="block text-sm text-gray-400 mb-2">
        GitHub Username
      </label>

      <input 
        id="username"
        type="text"
        placeholder="e.g. torvalds"
        class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 
        focus:outline-none focus:ring-2 focus:ring-indigo-500 
        placeholder-gray-500 text-white transition"
      >

      <button 
        id="roastBtn"
        class="mt-5 w-full py-3 rounded-xl font-semibold text-lg 
        bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98]
        transition duration-200 shadow-lg shadow-indigo-600/30">
        Roasting 🔥
      </button>

    </div>

    <!-- Result -->
    <div class="mt-6 hidden" id="resultBox">
      <div 
        id="resultText"
        class="bg-black/40 border border-white/10 rounded-xl p-4 text-gray-300 text-sm leading-relaxed whitespace-pre-line">
      </div>

      <button 
        id="againBtn"
        class="mt-4 w-full py-2 rounded-xl bg-gray-700 hover:bg-gray-600 text-sm transition">
        🔁 Roasting lagi
      </button>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8 text-xs text-gray-600">
      built for fun • jangan baper 😈
    </div>

  </div>

  <script>
    const btn = document.getElementById("roastBtn");
    const againBtn = document.getElementById("againBtn");
    const input = document.getElementById("username");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");

    async function roast() {
      const username = input.value.trim();

      if (!username) {
        alert("Masukin username dulu woy 😑");
        return;
      }

      // loading state
      btn.innerText = "Roasting...";
      btn.disabled = true;

      resultText.innerText = "";
      resultBox.classList.add("hidden");

      try {
        const res = await fetch("https://roast.exodusai.biz.id/roast", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username })
        });

        const data = await res.json();

        // tampilkan hasil
        resultText.innerText = data.roast || "Gagal roast 😢";
        resultBox.classList.remove("hidden");

      } catch (err) {
        resultText.innerText = "Error koneksi ke server 😭";
        resultBox.classList.remove("hidden");
      }

      // reset button
      btn.innerText = "Roast 🔥";
      btn.disabled = false;
    }

    btn.onclick = roast;
    againBtn.onclick = roast;

    // enter key support
    input.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        roast();
      }
    });
  </script>

</body>
</html>
