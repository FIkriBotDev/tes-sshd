<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500 flex items-center justify-center">

  <!-- CARD -->
  <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-xl p-8">

    <h2 class="text-3xl font-bold text-white text-center mb-6">
      Register ✨
    </h2>

    <!-- FORM -->
    <form id="registerForm" class="space-y-5">

      <!-- Username -->
      <div>
        <label class="block text-white/80 mb-1">Username</label>
        <input type="text" id="username"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/40"
          placeholder="Masukkan username"
          required />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-white/80 mb-1">Email</label>
        <input type="email" id="email"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/40"
          placeholder="Masukkan email"
          required />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-white/80 mb-1">Password</label>
        <input type="password" id="password"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/40"
          placeholder="Masukkan password"
          required />
      </div>

      <!-- BUTTON -->
      <button type="submit"
        class="w-full py-3 bg-white text-purple-600 font-semibold rounded-lg hover:bg-gray-100 transition">
        Register
      </button>

      <!-- LINK LOGIN -->
      <p class="text-center text-white/80 text-sm">
        Sudah punya akun?
        <a href="login.html" class="underline hover:text-white">Login</a>
      </p>

    </form>

    <!-- MESSAGE -->
    <p id="message" class="text-center text-white mt-4"></p>

  </div>

  <!-- SCRIPT -->
  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // VALIDASI (struktur kontrol)
      if (!username || !email || !password) {
        message.textContent = "Semua field wajib diisi!";
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password minimal 6 karakter!";
        return;
      }

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, email, password })
        });

        const result = await response.json();

        if (response.ok) {
          message.textContent = "Registrasi berhasil!";
          form.reset();
        } else {
          message.textContent = result.message || "Registrasi gagal!";
        }

      } catch (error) {
        console.error("Error:", error);
        message.textContent = "Terjadi kesalahan pada server!";
      }
    });
  </script>

</body>
</html>
