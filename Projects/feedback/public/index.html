<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExodusAI Feedback</title>

<style>
:root {
    --primary: #4f46e5;
    --secondary: #22c55e;
    --bg: #0f172a;
    --card: rgba(255,255,255,0.08);
    --text: #e5e7eb;
    --muted: #9ca3af;
}

* {
    box-sizing: border-box;
    transition: all .3s ease;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e293b, #020617);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* CARD */
.container {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    backdrop-filter: blur(16px);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,.4);
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 1.6rem;
    color: white;
}

.header p {
    margin-top: 6px;
    font-size: .9rem;
    color: var(--muted);
}

/* PROGRESS */
.progress {
    height: 6px;
    background: rgba(255,255,255,.1);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
}

/* SLIDE */
.slide {
    display: none;
    animation: fade .4s ease;
}

.slide.active {
    display: block;
}

@keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

h3 {
    margin-top: 0;
    font-size: 1.1rem;
}

/* INPUT */
input, textarea, select {
    width: 100%;
    margin-top: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    font-size: .95rem;
}

textarea {
    resize: none;
    min-height: 90px;
}

label {
    display: block;
    margin-top: 10px;
    cursor: pointer;
    color: var(--muted);
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    font-weight: 600;
}

button:hover {
    opacity: .9;
    transform: translateY(-1px);
}

/* STAR RATING */
.rating {
    display: flex;
    gap: 6px;
    margin: 8px 0 14px;
}

.star {
    font-size: 28px;
    color: #334155;
    cursor: pointer;
}

.star.active {
    color: gold;
    text-shadow: 0 0 10px rgba(255,215,0,.5);
}

/* RESPONSIVE */
@media(max-width: 480px) {
    .container {
        padding: 22px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>ExodusAI Feedback</h1>
        <p>Bantu kami jadi lebih baik 🚀</p>
    </div>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

<form id="form">

<div class="slide active">
<h3>Nama</h3>
<input name="nama" required>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Nomor WhatsApp</h3>
<input name="whatsapp" pattern="628[0-9]+" required>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Seberapa puas?</h3>
<label><input type="radio" name="puas" value="Sangat puas"> Sangat puas</label>
<label><input type="radio" name="puas" value="Puas"> Puas</label>
<label><input type="radio" name="puas" value="Biasa saja"> Biasa saja</label>
<label><input type="radio" name="puas" value="Kurang puas"> Kurang puas</label>
<label><input type="radio" name="puas" value="Tidak puas"> Tidak puas</label>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Kualitas AI</h3>
<div class="rating" data-name="ai"></div>
<h3>Kecepatan</h3>
<div class="rating" data-name="speed"></div>
<h3>Fitur</h3>
<div class="rating" data-name="fitur"></div>
<h3>Kemudahan</h3>
<div class="rating" data-name="mudah"></div>
<h3>Stabilitas</h3>
<div class="rating" data-name="stabil"></div>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Hal terbaik?</h3>
<textarea name="best"></textarea>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Perlu diperbaiki?</h3>
<textarea name="fix"></textarea>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Fitur masa depan?</h3>
<textarea name="future"></textarea>
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Rekomendasi (0–10)</h3>
<input type="number" name="recommend" min="0" max="10">
<button type="button" onclick="next()">Next</button>
</div>

<div class="slide">
<h3>Izin Testimoni</h3>
<select name="permission">
<option>Boleh dengan nama</option>
<option>Anonim</option>
<option>Tidak</option>
</select>
<button type="submit">Submit</button>
</div>

</form>
</div>

<script>
let slide = 0;
const slides = document.querySelectorAll(".slide");
const bar = document.getElementById("bar");

function next() {
    slides[slide].classList.remove("active");
    slide++;
    slides[slide].classList.add("active");
    bar.style.width = ((slide) / (slides.length - 1)) * 100 + "%";
}

// Rating stars (LOGIC ASLI)
document.querySelectorAll(".rating").forEach(div=>{
    const name = div.dataset.name;
    let input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    div.appendChild(input);

    for(let i=1;i<=5;i++){
        let s=document.createElement("span");
        s.innerHTML="★";
        s.className="star";
        s.onclick=()=>{
            input.value=i;
            [...div.children].forEach((x,idx)=>{
                if(idx<=i) x.classList.add("active");
                else x.classList.remove("active");
            });
        };
        div.appendChild(s);
    }
});

// Submit (LOGIC ASLI)
document.getElementById("form").onsubmit=async e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    await fetch("/submit", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(data)
    });
    alert("Terima kasih 🙏");
};
</script>

</body>
</html>
