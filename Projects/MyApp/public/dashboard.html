<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500">

  <!-- HEADER -->
  <header class="flex justify-between items-center p-6">
    <h1 class="text-white text-xl font-bold">Dashboard</h1>

    <button id="logoutBtn"
      class="px-4 py-2 border border-white/30 text-white rounded-lg backdrop-blur-md hover:bg-white/20 transition">
      Logout
    </button>
  </header>

  <!-- CONTENT -->
  <section class="flex items-center justify-center px-6 py-20">
    
    <div class="max-w-xl w-full text-center bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-xl p-10">
      
      <h2 id="welcomeText" class="text-3xl font-bold text-white mb-4">
        Welcome!
      </h2>

      <p class="text-white/80">
        Kamu berhasil login ke sistem 🎉
      </p>

    </div>

  </section>

  <!-- SCRIPT -->
  <script>
    const welcomeText = document.getElementById("welcomeText");
    const logoutBtn = document.getElementById("logoutBtn");

    // Ambil data user dari localStorage
    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    // PROTEKSI (struktur kontrol)
    if (!user) {
      window.location.href = "login.html";
    } else {
      welcomeText.textContent = `Welcome! @${user.username} 👋`;
    }

    // LOGOUT
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
