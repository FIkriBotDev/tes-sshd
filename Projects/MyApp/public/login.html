<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500 flex items-center justify-center">

  <!-- CARD -->
  <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-xl p-8">

    <h2 class="text-3xl font-bold text-white text-center mb-6">
      Login 🔐
    </h2>

    <!-- FORM -->
    <form id="loginForm" class="space-y-5">

      <!-- Email / Username -->
      <div>
        <label class="block text-white/80 mb-1">Email / Username</label>
        <input type="text" id="identifier"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/40"
          placeholder="Masukkan email atau username"
          required />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-white/80 mb-1">Password</label>
        <input type="password" id="password"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/60 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/40"
          placeholder="Masukkan password"
          required />
      </div>

      <!-- BUTTON -->
      <button type="submit"
        class="w-full py-3 bg-white text-purple-600 font-semibold rounded-lg hover:bg-gray-100 transition">
        Login
      </button>

      <!-- LINK REGISTER -->
      <p class="text-center text-white/80 text-sm">
        Belum punya akun?
        <a href="register.html" class="underline hover:text-white">Register</a>
      </p>

    </form>

    <!-- MESSAGE -->
    <p id="message" class="text-center text-white mt-4"></p>

  </div>

  <!-- SCRIPT -->
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const identifier = document.getElementById("identifier").value;
      const password = document.getElementById("password").value;

      // VALIDASI (struktur kontrol)
      if (!identifier || !password) {
        message.textContent = "Semua field wajib diisi!";
        return;
      }

      try {
        // GET data user dari backend
        const response = await fetch("/login");
        const users = await response.json();

        let userFound = false;

        // LOOP untuk cek user
        for (let i = 0; i < users.length; i++) {
          if (
            (users[i].email === identifier || users[i].username === identifier) &&
            users[i].password === password
          ) {
            userFound = true;

            // simpan user
            localStorage.setItem("loggedInUser", JSON.stringify(users[i]));

            break;
          }
        }

        // HASIL LOGIN
        if (userFound) {
          message.textContent = "Login berhasil!";

          // redirect ke dashboard
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);

        } else {
          message.textContent = "Email/Username atau password salah!";
        }

      } catch (error) {
        console.error("Error:", error);
        message.textContent = "Terjadi kesalahan saat mengambil data!";
      }
    });
  </script>

</body>
</html>
