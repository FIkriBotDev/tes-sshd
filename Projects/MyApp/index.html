<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500">

  <!-- HEADER -->
  <header class="flex justify-between items-center p-6">
    <h1 class="text-white text-xl font-bold">MyApp</h1>

    <div class="space-x-3">
      <a href="login.html" 
         class="px-4 py-2 text-white border border-white/30 rounded-lg backdrop-blur-md hover:bg-white/20 transition">
         Login
      </a>

      <a href="register.html" 
         class="px-4 py-2 bg-white text-purple-600 font-semibold rounded-lg hover:bg-gray-100 transition">
         Register
      </a>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="flex items-center justify-center px-6 py-20">
    
    <div class="max-w-2xl text-center bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-xl p-10">
      
      <h2 class="text-4xl font-bold text-white mb-4">
        Selamat Datang di MyApp 🚀
      </h2>

      <p class="text-white/80 mb-6">
        Aplikasi sederhana untuk belajar login, register, dan dashboard dengan konsep modern UI.
      </p>

      <div class="space-x-4">
        <a href="register.html"
           class="px-6 py-3 bg-white text-purple-600 font-semibold rounded-lg hover:bg-gray-100 transition">
           Mulai Sekarang
        </a>

        <a href="login.html"
           class="px-6 py-3 border border-white/30 text-white rounded-lg backdrop-blur-md hover:bg-white/20 transition">
           Sudah punya akun?
        </a>
      </div>

    </div>

  </section>

</body>
</html>
