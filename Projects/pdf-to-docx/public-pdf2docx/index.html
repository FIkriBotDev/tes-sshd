<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF ke DOCX Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/script.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-lg text-center">
      <h1 class="text-3xl font-bold mb-4 text-gray-800">
        🧾 PDF ke DOCX Converter
      </h1>
      <p class="text-gray-500 mb-6">
        Unggah file PDF kamu dan ubah menjadi file DOCX dengan mudah.
      </p>

      <form id="uploadForm" class="space-y-4">
        <input
          type="file"
          name="pdfFile"
          accept=".pdf"
          required
          class="w-full border border-gray-300 p-2 rounded-lg"
        />
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition-all"
        >
          Convert Sekarang
        </button>
      </form>

      <div id="loading" class="hidden mt-6 text-blue-600 font-semibold">
        ⏳ Sedang mengonversi...
      </div>

      <div id="result" class="hidden mt-6"></div>
    </div>
  </body>
</html>
